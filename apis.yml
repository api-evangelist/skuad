aid: skuad
name: Skuad
description: >-
  Skuad is a global HR and employment platform (now part of Payoneer as Payoneer
  Workforce Management) that lets companies hire, onboard, pay, and manage full-time
  employees and contractors across 160+ countries without setting up local legal
  entities. It provides employer-of-record (EOR) services, international payroll in
  70+ currencies, contractor management and payments, benefits administration,
  background verification, and built-in compliance with local employment, tax, and
  labor laws. Skuad was surfaced as a portfolio company of Anthemis and added to the
  API Evangelist network; this profile has been enriched from Skuad's public web
  presence. No public developer API, OpenAPI specification, or developer portal was
  found during enrichment.
